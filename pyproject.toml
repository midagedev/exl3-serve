[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exl3-serve"
version = "0.1.0"
description = "A llama-server-compatible HTTP front for ExLlamaV3: /props, /health, /slots and /v1/chat/completions with the llama-server timings object, so llama.cpp tooling (toktape and friends) can drive an EXL3 model unchanged."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "jinja2>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
exl3-serve = "exl3_serve.cli:main"

[tool.setuptools.packages.find]
include = ["exl3_serve*"]
